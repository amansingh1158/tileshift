<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="TileShift — a fresh take on the slide-and-merge puzzle. Classic, Time Attack, Moves and Daily modes. Play offline." />
  <title>TileShift</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app landing">
    <header class="landing-head">
      <div class="brand">
        <h1>TileShift</h1>
        <p class="tagline">slide &amp; merge puzzle</p>
      </div>
    </header>

    <nav class="mode-list" aria-label="Choose a game mode">
      <a class="mode-card accent-teal" href="play.html?mode=classic">
        <span class="mode-name">Classic</span>
        <span class="mode-desc">Free play &mdash; reach the target tile</span>
      </a>
      <a class="mode-card accent-rose" href="play.html?mode=time">
        <span class="mode-name">Time</span>
        <span class="mode-desc">3 minutes to beat your best</span>
      </a>
      <a class="mode-card accent-violet" href="play.html?mode=moves">
        <span class="mode-name">Moves</span>
        <span class="mode-desc">Reach the target in 100 moves</span>
      </a>
      <a class="mode-card accent-amber" href="play.html?mode=daily">
        <span class="mode-name">Daily</span>
        <span class="mode-desc">One seeded puzzle, every day</span>
      </a>
    </nav>

    <section class="leaderboard" id="leaderboard">
      <h2 class="lb-title">Leaderboard</h2>
      <div class="lb-tabs" id="lb-tabs"></div>
      <ol class="lb-list" id="lb-list"><li class="lb-note">Loading&hellip;</li></ol>
      <p class="lb-status" id="lb-status"></p>
    </section>

    <footer>TileShift &mdash; play offline, no ads, no data collection</footer>
  </div>

  <script type="module" src="js/landing.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
