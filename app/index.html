<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#faf8ef" />
  <meta name="description" content="2048 puzzle game. Slide and merge tiles to reach 2048. Play offline with classic, square and rectangle boards." />
  <title>2048 Puzzle</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header>
      <h1>2048</h1>
      <div class="scores">
        <div class="score-box">
          <div class="label">SCORE</div>
          <div class="value" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="label">BEST</div>
          <div class="value" id="best">0</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <select id="board-size" aria-label="Board size"></select>
      <select id="theme" aria-label="Theme"></select>
      <button id="undo" disabled>Undo</button>
      <button id="new-game">New Game</button>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>

      <div id="win-overlay" class="overlay hidden">
        <h2>You win!</h2>
        <p class="score-note">You reached the 2048 tile.</p>
        <div class="actions">
          <button id="win-continue">Keep Going</button>
          <button id="win-new">New Game</button>
        </div>
      </div>

      <div id="game-over-overlay" class="overlay hidden">
        <h2>Game Over</h2>
        <p class="score-note">Score: <span id="over-score">0</span></p>
        <div class="actions">
          <button id="over-new">New Game</button>
        </div>
      </div>
    </div>

    <p class="hint">Swipe, drag or use arrow keys to move tiles</p>

    <div class="dpad" aria-label="Move controls">
      <button class="up" data-dir="up" aria-label="Move up">&#9650;</button>
      <button class="left" data-dir="left" aria-label="Move left">&#9664;</button>
      <button class="down" data-dir="down" aria-label="Move down">&#9660;</button>
      <button class="right" data-dir="right" aria-label="Move right">&#9654;</button>
    </div>

    <footer>2048 Puzzle &mdash; play offline</footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
