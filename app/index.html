<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="TileShift — a fresh take on the slide-and-merge puzzle. Classic, Time Attack, Moves and Daily modes. Play offline." />
  <title>TileShift</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app landing">
    <header class="landing-head">
      <div class="brand">
        <h1>TileShift</h1>
        <p class="tagline">slide &amp; merge puzzle</p>
      </div>
    </header>

    <nav class="mode-list" aria-label="Choose a game mode">
      <a class="mode-card accent-teal" href="play.html?mode=classic">
        <span class="mode-name">Classic</span>
        <span class="mode-desc">Free play &mdash; reach the target tile</span>
      </a>
      <a class="mode-card accent-rose" href="play.html?mode=time">
        <span class="mode-name">Time</span>
        <span class="mode-desc">3 minutes to beat your best</span>
      </a>
      <a class="mode-card accent-violet" href="play.html?mode=moves">
        <span class="mode-name">Moves</span>
        <span class="mode-desc">Reach the target in 100 moves</span>
      </a>
      <a class="mode-card accent-amber" href="play.html?mode=daily">
        <span class="mode-name">Daily</span>
        <span class="mode-desc">One seeded puzzle, every day</span>
      </a>
    </nav>

    <section class="leaderboard" id="leaderboard">
      <h2 class="lb-title">Leaderboard</h2>
      <div class="lb-tabs" id="lb-tabs"></div>
      <ol class="lb-list" id="lb-list"><li class="lb-note">Loading&hellip;</li></ol>
      <p class="lb-status" id="lb-status"></p>
    </section>

    <div id="pg-signin" class="pg-signin" hidden>
      <button id="pg-signin-btn" class="pg-signin-btn" type="button">
        <svg class="pg-signin-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#1976D2" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
          <path fill="#FFC107" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#4CAF50" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
          <path fill="#4CAF50" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A11 11 0 0 0 12 .01 10.99 10.99 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
        </svg>
        <span>Sign in to save your name</span>
      </button>
    </div>

    <div id="banner" class="banner-slot"></div>
  </div>

  <script type="module" src="js/landing.js"></script>
  <script type="module" src="js/ads.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
